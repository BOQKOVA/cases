<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Russian Cases, One by One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Golos+Text:wght@400..900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf7; --surface:#ffffff; --ink:#0d0d0d; --muted:#4d4a4b;
  --pink:#fe98c0; --green:#80eb3d; --blue:#3dd0eb; --red:#eb583d; --yellow:#ffd23f; --lilac:#b9a1ff;
  --bw:3px; --border:3px solid var(--ink);
  --radius:18px; --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink); --shadow-lg:9px 9px 0 var(--ink);
  --display:"Bricolage Grotesque","Golos Text","Arial Black",system-ui,sans-serif;
  --body:"DM Sans","Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ok:#80eb3d; --bad:#eb583d;
  --c:#fe98c0; --c-soft:#ffe3ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.8px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
.ru{font-family:"Golos Text",var(--body);font-weight:500}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.box{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.press{transition:transform .12s,box-shadow .12s}
.press:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.press:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none;white-space:nowrap;background:var(--pink);border:var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:3px 12px;letter-spacing:-.02em}
.logo span{color:var(--ink)}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 6px 8px 2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px 6px 6px;border-radius:999px;border:var(--border);background:var(--surface);display:flex;gap:7px;align-items:center;box-shadow:3px 3px 0 var(--ink)}
.nav a:first-child,.nav a:last-child{padding-left:12px}
.nav a .l{font-family:"Golos Text";font-weight:800;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:13px;border:2px solid var(--ink)}
.nav a.on{background:var(--ink);color:#fff}
.nav a .done{font-weight:800}
.stress-btn{flex:none;border:var(--border);background:var(--green);color:var(--ink);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.stress-btn .ru{font-size:16px}
.stress-btn.off{background:var(--surface)}

main{max-width:1120px;margin:0 auto;padding:28px 16px 80px}
.view{display:none}.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* marquee */
.marquee{background:var(--ink);color:var(--pink);font-family:var(--display);font-weight:800;font-size:24px;overflow:hidden;white-space:nowrap;padding:8px 0;margin:0 -16px 26px;border-radius:0}
.marquee div{display:inline-block;animation:mq 28s linear infinite}
.marquee span{margin:0 16px}
.marquee .s{color:var(--green)}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* home */
.hero{background:var(--surface);border:var(--border);border-radius:27px;box-shadow:var(--shadow-lg);padding:30px 26px;margin-bottom:30px;position:relative;overflow:hidden}
.hero .tag{display:inline-block;font-family:var(--display);font-weight:800;background:var(--pink);border:var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:2px 12px;font-size:16px}
.hero h1{font-size:clamp(40px,8vw,84px);margin-top:16px;letter-spacing:-.05em}
.hero h1 em{font-style:normal;background:var(--green);border:var(--border);border-radius:16px;padding:0 12px;box-shadow:var(--shadow-sm);display:inline-block;margin-top:8px}
.hero p{max-width:640px;font-size:19px;font-weight:500;margin:18px 0 0}
.hero .sticker{position:absolute;right:22px;top:22px;background:var(--blue);border:var(--border);border-radius:999px;box-shadow:var(--shadow-sm);font-family:var(--display);font-weight:800;padding:4px 14px;transform:rotate(6deg)}
.face{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin:0 0 30px}
.face h2{font-size:26px;margin-bottom:4px}
.face .sub{color:var(--muted);margin:0 0 12px}
.face-row{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:11px 0;border-top:2px dashed var(--ink);align-items:baseline}
.face-row .cn{font-weight:700;display:flex;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.face-row .ru{font-size:20px}
.face-row .en{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.ccard{text-decoration:none;background:var(--cc,var(--surface));border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden;display:block;transition:transform .12s,box-shadow .12s;min-height:170px}
.ccard:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.ccard .big{font-family:"Golos Text";font-weight:900;font-size:80px;line-height:1;position:absolute;right:14px;bottom:6px;opacity:.9;-webkit-text-stroke:0}
.ccard .num{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.ccard h3{font-size:26px;margin:10px 0 2px}
.ccard .q{font-family:"Golos Text";font-size:18px;font-weight:600}
.ccard .badge{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--ink)}
.ccard .bar{display:none}
.note{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:26px}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:12px 22px;border-radius:999px;background:var(--pink);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:800;font-size:19px;border:var(--border);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.cta:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}

/* case page */
.case-head{border-radius:27px;padding:28px 24px;color:var(--ink);background:var(--c);position:relative;overflow:hidden;border:var(--border);box-shadow:var(--shadow-lg)}
.case-head .big{position:absolute;right:16px;bottom:-30px;font-family:"Golos Text";font-weight:900;font-size:200px;line-height:1;color:var(--surface);-webkit-text-stroke:3px var(--ink)}
.case-head .num{display:inline-block;font-weight:800;font-size:13px;text-transform:uppercase;background:var(--surface);border:var(--border);border-radius:10px;padding:1px 10px;box-shadow:var(--shadow-sm)}
.case-head h1{font-size:clamp(40px,8vw,76px);margin:14px 0 4px;letter-spacing:-.04em}
.case-head .rn{font-family:"Golos Text";font-size:22px;font-weight:700}
.case-head .qs{display:inline-flex;gap:10px;align-items:baseline;margin-top:14px;background:var(--surface);border:var(--border);box-shadow:var(--shadow-sm);padding:6px 14px;border-radius:12px;position:relative}
.case-head .qs .ru{font-size:22px;font-weight:800}
.case-head .big{z-index:0}
.case-head>*:not(.big){position:relative;z-index:1}
.case-head p.sum{max-width:600px;margin:16px 0 0;font-size:18px;font-weight:500;position:relative}
section.blk{margin-top:40px}
section.blk>h2{font-size:28px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
section.blk>h2 .n{width:38px;height:38px;border-radius:12px;background:var(--c);border:var(--border);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:18px;flex:none}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.use{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.use h3{font-size:19px;letter-spacing:-.01em}
.use p{margin:4px 0 10px;color:var(--muted);font-size:15px}
.use .ru{font-size:19px}
.use .en{font-size:14px;color:var(--muted)}
b.hl{color:var(--ink);background:var(--c);padding:0 5px;border-radius:6px;border:2px solid var(--ink);font-weight:800}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:12px 14px;text-align:left;border-bottom:2px solid var(--ink);vertical-align:top}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;background:var(--c)}
td .end{font-family:"Golos Text";font-weight:800;font-size:18px;background:var(--c-soft);padding:0 6px;border-radius:6px}
td .ex{font-family:"Golos Text";font-size:16px}
tr:last-child td{border-bottom:none}
.plural{margin-top:14px;font-size:15px;color:var(--muted)}
.plural b{color:var(--ink)}
.pron{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pron div{background:var(--surface);border:var(--border);border-radius:12px;padding:6px 10px;text-align:center;min-width:74px;box-shadow:3px 3px 0 var(--ink)}
.pron small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.pron .ru{font-weight:800;font-size:17px}
.exs{display:grid;gap:12px}
.exl{background:var(--surface);border:var(--border);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.exl .ru{font-size:20px}
.exl .en{color:var(--muted)}
.tip{background:var(--c);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:20px}
.tip strong{font-family:var(--display);font-weight:800}

/* exercises */
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:var(--border);border-radius:999px;padding:3px;box-shadow:3px 3px 0 var(--ink)}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.score-pill{font-weight:800;background:var(--green);border:var(--border);padding:5px 12px;border-radius:999px;box-shadow:3px 3px 0 var(--ink)}
.q-card{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 18px;margin-bottom:14px}
.q-card .qn{display:inline-block;font-size:12px;font-weight:800;background:var(--c);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.q-card .ru.sent{font-size:20px;margin:8px 0 12px}
.q-card .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink);text-align:center;font-weight:800}
.q-card .base{color:var(--muted);font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font-family:"Golos Text";font-weight:600;font-size:18px;padding:7px 16px;border-radius:12px;border:var(--border);background:var(--surface);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.opt:hover:not(:disabled){background:var(--c-soft)}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.right{background:var(--green)}
.opt.wrong{background:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:15px;display:none}
.fb.show{display:block}
.fb .en{color:var(--muted)}
.type-row{display:flex;gap:10px;flex-wrap:wrap}
.type-row input{font-family:"Golos Text";font-size:19px;padding:7px 12px;border-radius:12px;border:var(--border);background:var(--bg);flex:1;min-width:160px;outline:none}
.type-row input:focus{background:var(--c-soft)}
.type-row input.right{background:var(--green)}
.type-row input.wrong{background:var(--red)}
.btn{border:var(--border);background:var(--ink);color:#fff;font-weight:800;padding:7px 16px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.btn.c{background:var(--c);color:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.light{background:var(--pink);color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--pink)}
.kb{margin-top:12px;display:none;gap:5px;flex-direction:column}
.kb.show{display:flex}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:38px;padding:7px 0;border:2px solid var(--ink);background:var(--surface);border-radius:8px;font-family:"Golos Text";font-weight:600;font-size:17px;box-shadow:2px 2px 0 var(--ink)}
.kb button.w{max-width:80px;flex:2;font-size:14px;font-weight:800}

/* games */
.game{background:var(--ink);color:#fff;border:var(--border);border-radius:27px;box-shadow:9px 9px 0 var(--c);padding:22px;position:relative;overflow:hidden}
.game h3{font-size:26px;color:var(--pink)}
.game .gsub{color:#d6d0d3;margin:6px 0 14px;font-size:15px}
.g-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.g-stats div{background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:3px 12px;border-radius:999px;font-weight:800;font-size:14px}
.timer{height:14px;background:#2a2a2a;border:2px solid #fff;border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.g-word{text-align:center;padding:10px 0 4px}
.g-word .ru{font-size:42px;font-weight:800}
.g-word .ask{color:#d6d0d3;font-size:15px;margin-top:2px}
.g-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.g-opts button{background:var(--surface);color:var(--ink);border:3px solid var(--surface);border-radius:16px;padding:13px;font-family:"Golos Text";font-weight:700;font-size:22px;box-shadow:5px 5px 0 var(--c);transition:transform .08s}
.g-opts button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.g-opts button.right{background:var(--green);border-color:var(--green)}
.g-opts button.wrong{background:var(--red);border-color:var(--red)}
.g-center{text-align:center;padding:16px 0}
.g-center .bigscore{font-family:var(--display);font-size:64px;font-weight:800;color:var(--green)}
.pop{position:absolute;right:24px;top:22px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--green);opacity:0;transition:all .5s}
.pop.go{opacity:1;transform:translateY(-14px)}
.games-grid{display:grid;gap:30px}
.det-sent{font-family:"Golos Text";font-size:26px;font-weight:500;text-align:center;padding:10px 0}
.det-sent b{color:var(--ink);background:var(--yellow);padding:0 6px;border-radius:8px}
.det-en{text-align:center;color:#d6d0d3;min-height:24px;font-size:15px}
.det-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.det-opts button{border:3px solid var(--surface);border-radius:14px;padding:10px 6px;font-weight:800;color:var(--ink) !important;font-size:15px}
.det-opts button small{display:block;font-family:"Golos Text";font-weight:600}
.det-opts button.dim{opacity:.3}
.det-opts button.right{outline:4px solid var(--green);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:50px;margin:10px 0 16px}
.chip{font-family:"Golos Text";font-size:20px;padding:5px 14px;border-radius:999px;background:var(--surface);color:var(--ink);border:3px solid var(--surface);font-weight:800;box-shadow:3px 3px 0 var(--pink)}
.chip.sel{background:var(--yellow);border-color:var(--yellow);transform:scale(1.08)}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border-radius:16px;padding:10px;min-height:90px;border:3px dashed;background:rgba(255,255,255,.06);text-align:left;color:#fff}
.bin .bt{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.bin .items{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bin .items span{font-family:"Golos Text";font-size:15px;background:var(--surface);color:var(--ink);padding:0 8px;border-radius:99px;font-weight:700}
.small-note{color:#d6d0d3;font-size:14px;margin-top:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{text-decoration:none;font-family:var(--display);font-weight:800;font-size:18px;padding:10px 18px;border-radius:999px;background:var(--surface);border:var(--border);box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.pager a:last-child{background:var(--c)}
.pager a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
footer{background:var(--ink);color:var(--pink);text-align:center;font-family:var(--display);font-weight:800;font-size:20px;padding:22px 16px}
@media (max-width:560px){
  .face-row{grid-template-columns:1fr;gap:2px}
  .det-opts{grid-template-columns:repeat(2,1fr)}
  .logo{display:none}
  .g-word .ru{font-size:34px}
  .hero .sticker{display:none}
  .case-head .big{font-size:130px;opacity:.5}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#home">Падежи</a>
  <nav class="nav" id="nav"></nav>
  <button class="stress-btn" id="stressBtn" title="Show or hide stress marks"></button>
</div></header>
<main id="main"></main>
<footer>Boqkova Teach ✦ Russian cases, one by one</footer>

<script>
/* ======================= DATA ======================= */
const NOUNS = {
  'мама':['мама','мамы','маме','маму','мамой','маме'],
  'брат':['брат','брата','брату','брата','братом','брате'],
  'стол':['стол','стола','столу','стол','столом','столе'],
  'окно':['окно','окна','окну','окно','окном','окне'],
  'неделя':['неделя','недели','неделе','неделю','неделей','неделе'],
  'музей':['музей','музея','музею','музей','музеем','музее'],
  'дверь':['дверь','двери','двери','дверь','дверью','двери'],
  'книга':['книга','книги','книге','книгу','книгой','книге'],
  'море':['море','моря','морю','море','морем','море'],
  'учитель':['учитель','учителя','учителю','учителя','учителем','учителе'],
  'Россия':['Россия','России','России','Россию','Россией','России'],
  'город':['город','города','городу','город','городом','городе'],
  'подруга':['подруга','подруги','подруге','подругу','подругой','подруге'],
  'письмо':['письмо','письма','письму','письмо','письмом','письме'],
  'друг':['друг','друга','другу','друга','другом','друге'],
  'школа':['школа','школы','школе','школу','школой','школе'],
  'словарь':['словарь','словаря','словарю','словарь','словарём','словаре'],
  'кошка':['кошка','кошки','кошке','кошку','кошкой','кошке'],
  'папа':['папа','папы','папе','папу','папой','папе'],
  'площадь':['площадь','площади','площади','площадь','площадью','площади'],
  'парк':['парк','парка','парку','парк','парком','парке'],
  'сестра':['сестра','сестры','сестре','сестру','сестрой','сестре']
};

const CASES = [
{

const SDICT = {}; STRESSED.forEach(w=>{SDICT[w.replace(/́/g,'')]=w;});
const RUWORD = /[А-Яа-яЁё́]+/g;
let stressOn = (()=>{try{return localStorage.getItem('rc-stress')!=='off'}catch(e){return true}})();
function stressWord(w){
  if(/[́ёЁ]/.test(w)) return w;
  const s = SDICT[w.toLowerCase()]; if(!s) return w;
  const pos = s.indexOf('́');
  return w.slice(0,pos)+'́'+w.slice(pos);
}
function processText(n){
  const p=n.parentElement; if(!p || p.closest('.kb,script,style')) return;
  const t = stressOn ? n.data.replace(RUWORD,stressWord) : n.data.replace(/́/g,'');
  if(t!==n.data) n.data=t;
}
function stressTree(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const list=[]; let n;
  while((n=tw.nextNode())) list.push(n);
  list.forEach(processText);
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(nd=>{
  if(nd.nodeType===3) processText(nd); else if(nd.nodeType===1) stressTree(nd);
}))).observe(document.getElementById('main'),{childList:true,subtree:true});
function setStressBtn(){const b=document.getElementById('stressBtn'); b.innerHTML=`<span class="ru">а́</span> Stress: ${stressOn?'on':'off'}`; b.classList.toggle('off',!stressOn);}

const pick = a=>a[Math.floor(Math.random()*a.length)];
const hl = s=>s.replace(/\*(.+?)\*/g,'<b class="hl">$1</b>');
const norm = s=>s.trim().toLowerCase().replace(/́/g,'').replace(/ё/g,'е');

/* ---------- exercises ---------- */
const KB_ROWS = ['йцукенгшщзхъ','фывапролджэ','ячсмитьбюё'];
function mountExercises(c){
  let mode='choice', score=0, answered=0, items=shuffle(c.ex);
  const list=$('#exList'), sc=$('#exScore');
  function upd(){sc.textContent=`${score} / ${items.length}`; if(answered===items.length){const prev=store.get()['ex-'+c.id]||0; if(score>=prev) store.set('ex-'+c.id,score); renderNav(c.id);}}
  function render(){
    score=0;answered=0;upd();
    list.innerHTML = items.map((q,k)=>{
      const sent = q[0].replace('___','<span class="blank">?</span>');
      const body = mode==='choice'
        ? `<div class="opts">${shuffle([q[2],...q[3]]).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`
        : `<div class="type-row"><input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word…" lang="ru"><button class="btn c chk">Check</button><button class="btn ghost kbt" title="Russian keyboard">⌨︎ АБВ</button></div>
           <div class="kb">${KB_ROWS.map(r=>`<div class="r">${[...r].map(ch=>`<button data-k="${ch}">${ch}</button>`).join('')}${r===KB_ROWS[2]?'<button class="w" data-k="back">⌫</button>':''}</div>`).join('')}</div>`;
      return `<div class="q-card" data-i="${k}"><div class="qn">${k+1}</div><div class="ru sent">${sent} <span class="base">(${q[1]})</span></div>${body}<div class="fb"></div></div>`;
    }).join('');
  }
  function finish(card,q,ok,given){
    answered++; if(ok) score++;
    card.querySelector('.blank').textContent=q[2];
    card.querySelector('.blank').style.color = ok?'var(--ok)':'var(--bad)';
    const fb=card.querySelector('.fb'); fb.classList.add('show');
    fb.innerHTML = (ok?'<b style="color:var(--ok)">✓ Correct!</b> ':`<b style="color:var(--bad)">✗ Answer: <span class="ru">${q[2]}</span></b> `)+`<span class="en">— ${q[4]}</span>`;
    upd();
  }
  list.onclick = e=>{
    const card=e.target.closest('.q-card'); if(!card) return;
    const q=items[+card.dataset.i];
    if(e.target.classList.contains('opt')){
      const v=e.target.dataset.v, ok=v===q[2];
      card.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.dataset.v===q[2]) b.classList.add('right');});
      if(!ok) e.target.classList.add('wrong');
      finish(card,q,ok);
    }
    const inp=card.querySelector('input');
    if(e.target.classList.contains('chk')) check(card,q,inp);
    if(e.target.classList.contains('kbt')){card.querySelector('.kb').classList.toggle('show');}
    if(e.target.dataset.k && inp && !inp.disabled){
      const k=e.target.dataset.k;
      inp.value = k==='back'? inp.value.slice(0,-1) : inp.value+k;
    }
  };
  list.onkeydown = e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){const card=e.target.closest('.q-card'); check(card,items[+card.dataset.i],e.target);} };
  function check(card,q,inp){
    if(inp.disabled||!inp.value.trim()) return;
    const ok = norm(inp.value)===norm(q[2]);
    inp.disabled=true; inp.classList.add(ok?'right':'wrong');
    card.querySelector('.chk').disabled=true;
    const kb=card.querySelector('.kb'); kb.classList.remove('show');
    finish(card,q,ok);
  }
  $('#mode').onclick=e=>{const m=e.target.dataset.m; if(!m) return; mode=m; $('#mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); render();};
  $('#exReset').onclick=()=>{items=shuffle(c.ex);render();list.scrollIntoView({behavior:'smooth',block:'start'});};
  render();
}

/* ---------- Ending Rush game (per case or mixed) ---------- */
function mountRush(el, caseIdx, seconds){
  const key = 'rush-'+(caseIdx==null?'mixed':CASES[caseIdx].id);
  const color = caseIdx==null?'#80eb3d':CASES[caseIdx].color;
  el.style.setProperty('--c',color);
  let score=0, streak=0, t=0, timer=null, cur=null;
  const title = caseIdx==null?'Ending Rush: all cases':`Ending Rush: ${CASES[caseIdx].en}`;
  const sub = caseIdx===0
    ? `You’ll see a word in another case. Tap its <b>dictionary form</b> (Nominative) as fast as you can. ${seconds} seconds!`
    : caseIdx==null
      ? `Each word comes with a case. Tap the right form. ${seconds} seconds, streaks give bonus points!`
      : `Tap the ${CASES[caseIdx].en} form of each word as fast as you can. ${seconds} seconds!`;
  function intro(){
    const best=store.get()[key];
    el.innerHTML=`<h3>⚡ ${title}</h3><p class="gsub">${sub}</p>
      <div class="g-center">${best?`<div style="color:#d6d0d3">Your best: <b style="color:#fff">${best}</b></div>`:''}<button class="btn light" style="margin-top:10px;font-size:18px;padding:12px 26px">Start</button></div>`;
    el.querySelector('button').onclick=start;
  }
  function start(){
    score=0;streak=0;t=seconds*10;
    el.innerHTML=`<h3>⚡ ${title}</h3>
      <div class="g-stats" style="margin-top:10px"><div>Score: <span id="gs">0</span></div><div>Streak: <span id="gk">0</span>🔥</div></div>
      <div class="timer"><i></i></div>
      <div class="g-word"><div class="ru" id="gw"></div><div class="ask" id="ga"></div></div>
      <div class="g-opts" id="go"></div><span class="pop" id="gp">+1</span>`;
    next();
    timer=setInterval(()=>{t--; el.querySelector('.timer i').style.width=(t/(seconds*10)*100)+'%'; if(t<=0) end();},100);
  }
  function next(){
    const noun=pick(Object.keys(NOUNS)), forms=NOUNS[noun];
    const ci = caseIdx==null? Math.floor(Math.random()*6) : caseIdx;
    let shown, ask, ans;
    if(ci===0){
      const others=[1,2,3,4,5].map(k=>forms[k]).filter(f=>f!==forms[0]);
      shown = pick(others); ans=forms[0];
      ask = caseIdx==null? `<b style="color:${CASES[0].color}">Nominative</b> (dictionary form)?` : 'dictionary form?';
    } else {
      shown = forms[0]; ans=forms[ci];
      ask = `<b style="color:${CASES[ci].color}">${CASES[ci].en}</b> · <span class="ru">${CASES[ci].q.split(' ')[0]}</span>`;
    }
    const pool = shuffle([...new Set(forms.filter(f=>f!==ans))]).slice(0,2);
    cur={ans};
    $('#gw',el).textContent=shown; $('#ga',el).innerHTML=ask;
    $('#go',el).innerHTML=shuffle([ans,...pool]).map(o=>`<button>${o}</button>`).join('');
    $('#go',el).querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b));
  }
  let lock=false;
  function choose(b){
    if(lock||t<=0) return; lock=true;
    const ok=norm(b.textContent)===norm(cur.ans);
    if(ok){streak++; const pts=streak>=5?2:1; score+=pts; const p=$('#gp',el); p.textContent='+'+pts; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); b.classList.add('right');}
    else {streak=0; b.classList.add('wrong'); $('#go',el).querySelectorAll('button').forEach(x=>{if(norm(x.textContent)===norm(cur.ans))x.classList.add('right')});}
    $('#gs',el).textContent=score; $('#gk',el).textContent=streak;
    setTimeout(()=>{lock=false; if(t>0) next();}, ok?260:900);
  }
  function end(){
    clearInterval(timer); timer=null;
    const best=store.get()[key]||0, isBest=score>best;
    if(isBest) store.set(key,score);
    const msg = score>=20?'Отлично! Excellent!':score>=12?'Хорошо! Well done!':score>=6?'Неплохо! Not bad!':'Попробуй ещё! Try again!';
    el.innerHTML=`<h3>⚡ ${title}</h3><div class="g-center"><div style="color:#d6d0d3">Time’s up!</div><div class="bigscore">${score}</div><div class="ru" style="font-size:20px">${msg}</div>
      ${isBest&&best?'<div style="color:var(--green);font-weight:700;margin-top:6px">🏆 New best score!</div>':`<div style="color:#d6d0d3;margin-top:6px">Best: ${Math.max(best,score)}</div>`}
      <button class="btn light" style="margin-top:14px">Play again</button></div>`;
    el.querySelector('button').onclick=start;
  }
  el._stop=()=>{if(timer)clearInterval(timer)};
  intro();
}

/* ---------- Case Detective ---------- */
function mountDetective(el){
  let deck=shuffle(DETECTIVE), i=0, score=0, done=false;
  function render(){
    if(i>=10){ el.innerHTML=`<h3>🔍 Case Detective</h3><div class="g-center"><div class="bigscore">${score}/10</div><div class="ru" style="font-size:20px">${score>=9?'Шерлок Холмс!':score>=6?'Хорошая работа!':'Попробуй ещё раз!'}</div><button class="btn light" style="margin-top:14px">New round</button></div>`;
      const best=store.get()['detective']||0; if(score>best) store.set('detective',score);
      el.querySelector('button').onclick=()=>{deck=shuffle(DETECTIVE);i=0;score=0;render();}; return; }
    const d=deck[i]; done=false;
    el.innerHTML=`<h3>🔍 Case Detective</h3><p class="gsub">Which case is the highlighted word in?</p>
      <div class="g-stats"><div>Question ${i+1}/10</div><div>Score: ${score}</div></div>
      <div class="det-sent">${d[0].replace(/\*(.+?)\*/,'<b>$1</b>')}</div>
      <div class="det-en" id="den"></div>
      <div class="det-opts">${CASES.map((c,k)=>`<button data-k="${k}" style="background:${c.color}">${c.en}<small>${c.q.split(' ')[0]}</small></button>`).join('')}</div>`;
    el.querySelectorAll('.det-opts button').forEach(b=>b.onclick=()=>{
      if(done) return; done=true;
      const k=+b.dataset.k, ok=k===d[1]; if(ok) score++;
      el.querySelectorAll('.det-opts button').forEach(x=>{const xk=+x.dataset.k; if(xk===d[1]) x.classList.add('right'); else x.classList.add('dim');});
      $('#den',el).innerHTML=(ok?'<b style="color:var(--green)">✓ Right!</b> ':`<b style="color:var(--red)">✗ It’s ${CASES[d[1]].en}.</b> `)+d[2];
      setTimeout(()=>{i++;render();}, ok?1300:2300);
    });
  }
  render();
}

/* ---------- Preposition Sort ---------- */
function mountSort(el){
  let chips, sel=null, placed, score, mistakes;
  function reset(){chips=shuffle(PREPS.map((p,i)=>i)); placed={1:[],2:[],3:[],4:[],5:[]}; score=0; mistakes=0; sel=null; render();}
  function render(){
    if(!chips.length){
      el.innerHTML=`<h3>🧺 Preposition Sort</h3><div class="g-center"><div class="bigscore">${mistakes===0?'Perfect!':mistakes+' mistake'+(mistakes>1?'s':'')}</div><div style="color:#d6d0d3">All ${PREPS.length} prepositions sorted.</div><button class="btn light" style="margin-top:14px">Play again</button></div>`;
      el.querySelector('button').onclick=reset; return;
    }
    el.innerHTML=`<h3>🧺 Preposition Sort</h3><p class="gsub">Tap a preposition, then tap the case it takes.</p>
      <div class="g-stats"><div>Left: ${chips.length}</div><div>Mistakes: ${mistakes}</div></div>
      <div class="chips">${chips.map(i=>`<button class="chip ${sel===i?'sel':''}" data-i="${i}" title="${PREPS[i][2]}">${PREPS[i][0]}</button>`).join('')}</div>
      <div id="sel-en" class="det-en">${sel!=null?`<span class="ru">${PREPS[sel][0]}</span> = ${PREPS[sel][2]}`:'&nbsp;'}</div>
      <div class="bins">${[1,2,3,4,5].map(k=>`<button class="bin" data-k="${k}" style="border-color:${CASES[k].color}"><div class="bt"><span class="dot" style="background:${CASES[k].color}"></span>${CASES[k].en}</div><div class="items">${placed[k].map(i=>`<span>${PREPS[i][0]}</span>`).join('')}</div></button>`).join('')}</div>
      <p class="small-note">Heads-up: <span class="ru">в, на, за, под</span> and <span class="ru">с</span> can take two or three different cases depending on meaning (e.g. <span class="ru">в школе</span> “at school” vs <span class="ru">в школу</span> “to school”), so they’re left out here.</p>`;
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render();});
    el.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{
      if(sel==null) return;
      const k=+b.dataset.k;
      if(PREPS[sel][1]===k){placed[k].push(sel); chips=chips.filter(x=>x!==sel); sel=null; render();}
      else {mistakes++; const ch=el.querySelector(`.chip[data-i="${sel}"]`); render(); const c2=el.querySelector(`.chip[data-i="${sel}"]`); if(c2){c2.classList.add('shake');}}
    });
  }
  reset();
}

function gamesView(){
  return `<div class="hero" style="padding-bottom:6px"><h1>Mini <em>games</em></h1><p>Mix all six cases. Best scores are saved in this browser.</p></div>
  <div class="games-grid">
    <div class="game" id="g-rush"></div>
    <div class="game" id="g-det"></div>
    <div class="game" id="g-sort"></div>
  </div>
  <div class="pager"><a href="#prepositional">← Prepositional</a><a href="#home">Back to start</a></div>`;
}

/* ======================= ROUTER ======================= */
let activeGames=[];
function route(){
  activeGames.forEach(g=>g._stop&&g._stop()); activeGames=[];
  const h=(location.hash||'#home').slice(1);
  const idx=CASES.findIndex(c=>c.id===h);
  const main=$('#main');
  const root=document.documentElement;
  if(idx>=0){
    const c=CASES[idx];
    root.style.setProperty('--c',c.color); root.style.setProperty('--c-soft',c.soft);
    main.innerHTML=`<div class="view on">${caseView(c,idx)}</div>`;
    mountExercises(c);
    const r=$('#rush'); mountRush(r,idx,30); activeGames.push(r);
    renderNav(c.id);
  } else if(h==='games'){
    root.style.setProperty('--c','#fe98c0'); root.style.setProperty('--c-soft','#ffe3ee');
    main.innerHTML=`<div class="view on">${gamesView()}</div>`;
    const r=$('#g-rush'); mountRush(r,null,60); activeGames.push(r);
    mountDetective($('#g-det')); mountSort($('#g-sort'));
    renderNav('games');
  } else {
    root.style.setProperty('--c','#fe98c0'); root.style.setProperty('--c-soft','#ffe3ee');
    main.innerHTML=`<div class="view on">${homeView()}</div>`;
    renderNav('home');
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.getElementById('stressBtn').onclick=()=>{
  stressOn=!stressOn; try{localStorage.setItem('rc-stress',stressOn?'on':'off')}catch(e){}
  setStressBtn(); stressTree(document.getElementById('main'));
};
setStressBtn();
route();
</script>
